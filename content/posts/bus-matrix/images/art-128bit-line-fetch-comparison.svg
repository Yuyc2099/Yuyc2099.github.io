<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">32-bit word fetch compared with an ART 128-bit line fetch</title>
  <desc id="desc">The baseline performs four separate Flash reads and waits four times. ART reads one 128-bit line containing four 32-bit instructions, so the following three instructions need no additional Flash read.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .panel-title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .box-text { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .summary { font: 700 20px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .request { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .wait { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .ready { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .deliver { fill: #ecfccb; stroke: #65a30d; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .connector { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="700" y="52" text-anchor="middle" class="title">Flash Fetch: 32-bit Words vs. One ART 128-bit Line</text>

  <rect x="40" y="82" width="1320" height="276" class="panel"/>
  <text x="70" y="122" class="panel-title">Baseline model: four independent 32-bit Flash reads</text>
  <text x="70" y="151" class="small">Each instruction starts another Flash access and sees another wait window.</text>

  <line x1="82" y1="292" x2="1318" y2="292" class="line"/>
  <text x="1280" y="327" class="small">Time</text>

  <g>
    <rect x="84" y="194" width="72" height="64" rx="7" class="request"/>
    <text x="120" y="226" class="box-text">Req I1</text>
    <rect x="156" y="194" width="142" height="64" rx="7" class="wait"/>
    <text x="227" y="226" class="box-text">Flash wait</text>
    <rect x="298" y="194" width="76" height="64" rx="7" class="ready"/>
    <text x="336" y="226" class="box-text">I1</text>

    <rect x="390" y="194" width="72" height="64" rx="7" class="request"/>
    <text x="426" y="226" class="box-text">Req I2</text>
    <rect x="462" y="194" width="142" height="64" rx="7" class="wait"/>
    <text x="533" y="226" class="box-text">Flash wait</text>
    <rect x="604" y="194" width="76" height="64" rx="7" class="ready"/>
    <text x="642" y="226" class="box-text">I2</text>

    <rect x="696" y="194" width="72" height="64" rx="7" class="request"/>
    <text x="732" y="226" class="box-text">Req I3</text>
    <rect x="768" y="194" width="142" height="64" rx="7" class="wait"/>
    <text x="839" y="226" class="box-text">Flash wait</text>
    <rect x="910" y="194" width="76" height="64" rx="7" class="ready"/>
    <text x="948" y="226" class="box-text">I3</text>

    <rect x="1002" y="194" width="72" height="64" rx="7" class="request"/>
    <text x="1038" y="226" class="box-text">Req I4</text>
    <rect x="1074" y="194" width="142" height="64" rx="7" class="wait"/>
    <text x="1145" y="226" class="box-text">Flash wait</text>
    <rect x="1216" y="194" width="76" height="64" rx="7" class="ready"/>
    <text x="1254" y="226" class="box-text">I4</text>
  </g>

  <text x="700" y="340" class="summary" fill="#b91c1c">4 Flash reads / 4 wait windows</text>

  <rect x="40" y="386" width="1320" height="326" class="panel"/>
  <text x="70" y="426" class="panel-title">STM32F4 ART: one 128-bit Flash line contains 4 x 32-bit instructions</text>
  <text x="70" y="455" class="small">Only the line fill waits for Flash; I2, I3 and I4 are then supplied from the fetched line.</text>

  <text x="76" y="515" class="label">Flash line fill</text>
  <rect x="230" y="480" width="120" height="64" rx="7" class="request"/>
  <text x="290" y="512" class="box-text">Req line</text>
  <rect x="350" y="480" width="170" height="64" rx="7" class="wait"/>
  <text x="435" y="512" class="box-text">Flash wait</text>

  <rect x="566" y="474" width="536" height="76" rx="9" class="ready"/>
  <text x="834" y="462" class="small" text-anchor="middle">128-bit line returned once</text>
  <line x1="700" y1="474" x2="700" y2="550" stroke="#16a34a" stroke-width="2"/>
  <line x1="834" y1="474" x2="834" y2="550" stroke="#16a34a" stroke-width="2"/>
  <line x1="968" y1="474" x2="968" y2="550" stroke="#16a34a" stroke-width="2"/>
  <text x="633" y="512" class="box-text">I1</text>
  <text x="767" y="512" class="box-text">I2</text>
  <text x="901" y="512" class="box-text">I3</text>
  <text x="1035" y="512" class="box-text">I4</text>
  <path d="M 520 512 L 566 512" class="connector"/>

  <text x="76" y="620" class="label">CPU delivery</text>
  <rect x="566" y="584" width="118" height="58" rx="7" class="deliver"/>
  <text x="625" y="613" class="box-text">I1</text>
  <rect x="700" y="584" width="118" height="58" rx="7" class="deliver"/>
  <text x="759" y="613" class="box-text">I2</text>
  <rect x="834" y="584" width="118" height="58" rx="7" class="deliver"/>
  <text x="893" y="613" class="box-text">I3</text>
  <rect x="968" y="584" width="118" height="58" rx="7" class="deliver"/>
  <text x="1027" y="613" class="box-text">I4</text>
  <path d="M 633 550 L 625 584" class="connector"/>
  <path d="M 767 550 L 759 584" class="connector"/>
  <path d="M 901 550 L 893 584" class="connector"/>
  <path d="M 1035 550 L 1027 584" class="connector"/>

  <path d="M 700 662 L 1086 662" stroke="#16a34a" stroke-width="3"/>
  <path d="M 700 654 L 700 670 M 1086 654 L 1086 670" stroke="#16a34a" stroke-width="3"/>
  <text x="893" y="694" class="summary" fill="#15803d">3 additional Flash wait windows avoided</text>
</svg>
